name: Daily Job Ingestion & Verification

on:
  schedule:
    # Runs every day at 01:30 UTC = 7:00 AM IST
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Daily Ingestion & Verification Pipeline
        run: node scripts/fetch-jobs.mjs

      - name: Verify Build
        run: npm run build

      - name: Commit and Push Updates
        run: |
          git config --global user.name "zovyn-bot"
          git config --global user.email "bot@zovyn.in"
          git add data/jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): daily verified job alert updates [skip ci]" && git push)
