  </text>

  <rect x="910" y="45" width="230" height="40" rx="20" fill="url(#badgeRed)" />
  <text x="1025" y="71" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">
