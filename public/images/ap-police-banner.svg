  </text>

  <g transform="translate(60, 380)">
    <rect x="0" y="0" width="340" height="85" rx="16" fill="#1e1b4b" stroke="#ef4444" stroke-width="1.5" />
    <text x="20" y="34" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fecaca">QUALIFICATION</text>
    <text x="20" y="65" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">Intermediate (PC) / Degree (SI)</text>

    <rect x="360" y="0" width="340" height="85" rx="16" fill="#1e1b4b" stroke="#ef4444" stroke-width="1.5" />
    <text x="380" y="34" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fecaca">SELECTION STAGES</text>
    <text x="380" y="65" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">Prelims, PMT/PET, Mains</text>

    <rect x="720" y="0" width="360" height="85" rx="16" fill="#1e1b4b" stroke="#ef4444" stroke-width="1.5" />
