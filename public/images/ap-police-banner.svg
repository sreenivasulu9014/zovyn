<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgPolice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="badgeRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgPolice)" />

  <circle cx="980" cy="190" r="280" fill="#dc2626" opacity="0.18" />
  <circle cx="180" cy="460" r="230" fill="#4338ca" opacity="0.2" />

  <rect x="60" y="45" width="340" height="40" rx="20" fill="#ffffff" fill-opacity="0.15" />
  <circle cx="82" cy="65" r="8" fill="#ef4444" />
  <text x="102" y="71" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">
